# agent-factory — Tier B/C (agent creation / deployment worker)
# Inherits all defaults from config.base.yaml; overrides below.
# Uses FreeLLMAPI for agent creation tasks.

model:
  default: auto
  provider: FreeLLMAPI
  api_key: HERMES_FREELMAPI_KEY
  base_url: http://localhost:3001/v1

custom_providers:
  - name: FreeLLMAPI
    base_url: http://localhost:3001/v1
    key_env: HERMES_FREELMAPI_KEY
    model: auto
    models:
      auto: {}
      fusion: {}
    models_discovered: false

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
  disabled: []

memory:
  provider: builtin

# agent-factory keeps the full tool_loop_guardrails and gateway blocks
# because it is the agent that deploys new profiles and may need to
# verify gateway state during creation.

gateway:
  enabled: false