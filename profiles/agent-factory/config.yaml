# agent-factory — Tier B/C (agent creation / deployment worker)
# Inherits all defaults from config.base.yaml; overrides below.

model:
  default: nvidia/nemotron-3-super-120b-a12b
  provider: nvidia
  base_url: ''

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
  disabled: []

memory:
  provider: builtin

# agent-factory keeps the full tool_loop_guardrails and gateway blocks
# because it is the agent that deploys new profiles and may need to
# verify gateway state during creation.

gateway:
  enabled: false
