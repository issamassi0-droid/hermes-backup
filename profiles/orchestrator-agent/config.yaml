# orchestrator-agent — Tier A (governor / entry point)
# Inherits all defaults from config.base.yaml; overrides below.
# Memory backend: hindsight (shared hindsight provider for Tier A).

model:
  default: nemotron-3-ultra-free
  provider: opencode-free
  base_url: https://opencode.ai/zen/v1

display:
  skin: default
  enabled: false

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
  disabled: []

memory:
  provider: hindsight
