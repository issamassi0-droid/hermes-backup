# orchestrator-agent — Tier A (governor / entry point)
# Inherits all defaults from config.base.yaml; overrides below.
# Memory backend: hindsight (shared hindsight provider for Tier A).
# Uses FreeLLMAPI as primary, opencode-free as fallback.

model:
  default: auto
  provider: FreeLLMAPI
  api_key: HERMES_FREELMAPI_KEY
  base_url: http://localhost:3001/v1

custom_providers:
  - name: FreeLLMAPI
    base_url: http://localhost:3001/v1
    key_env: HERMES_FREELMAPI_KEY
    model: auto
    models:
      auto: {}
      fusion: {}
    models_discovered: false

display:
  skin: default
  enabled: false

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
  disabled: []

memory:
  provider: hindsight
