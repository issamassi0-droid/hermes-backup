# research-agent-multi — Tier B (multi-source research worker)
# Inherits all defaults from config.base.yaml; overrides below.
# Memory backend: builtin.

model:
  default: auto
  provider: FreeLLMAPI
  api_key: HERMES_FREELMAPI_KEY
  base_url: http://localhost:3001/v1

display:
  skin: default

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
  disabled: []

memory:
  provider: builtin

custom_providers:
  - name: FreeLLMAPI
    base_url: http://localhost:3001/v1
    key_env: HERMES_FREELMAPI_KEY
    model: auto
    models:
      auto: {}
      fusion: {}
    models_discovered: false

skills:
  enabled:
    - grounded-citations
    - deep-web-research
    - competitor-news-monitor
    - rss-feeds
    - session_search
    - arxiv
    - x_search
    - web
    - browser
    - code_execution
    - terminal
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - todo
    - tts
    - vision
    - clarify
    - computer_use
    - cronjob