# system-operator — Tier B/C (system maintenance / ops worker)
# Inherits all defaults from config.base.yaml; overrides below.
# Uses FreeLLMAPI proxy at localhost:3001 as primary provider.
# Memory backend: builtin.

model:
  default: auto
  provider: custom:freellmapi
  base_url: http://localhost:3001/v1
  api_key: ${HERMES_FREELMAPI_KEY}

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
  disabled: []

memory:
  provider: builtin

gateway:
  enabled: false
