# research-agent-youtube — Tier B (YouTube research worker)
# Inherits all defaults from config.base.yaml; overrides below.
# Uses FreeLLMAPI as primary, opencode-free as fallback.

model:
  default: upstage/solar-pro4:free
  provider: nous
  base_url: https://inference-api.nousresearch.com/v1

  api_mode: chat_completions
custom_providers:
  - name: FreeLLMAPI
    base_url: http://localhost:3001/v1
    key_env: HERMES_FREELMAPI_KEY
    model: auto
    models:
      auto: {}
      fusion: {}
    models_discovered: false

agent:
  max_turns: 100

browser:
  enabled: true

display:
  skin: default

skills:
  enabled:
    - deep-web-research
    - youtube-content
    - browser
    - session_search
    - web
    - code_execution
    - terminal
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - todo
    - tts
    - vision
    - clarify
    - computer_use
    - cronjob

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
