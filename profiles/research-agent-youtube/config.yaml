# research-agent-youtube — Tier B (YouTube research worker)
# Inherits all defaults from config.base.yaml; overrides below.

model:
  default: nemotron-3-ultra-free
  provider: opencode-free
  base_url: https://opencode.ai/zen/v1

agent:
  max_turns: 100

browser:
  enabled: true

display:
  skin: default

skills:
  enabled:
    - deep-web-research
    - youtube-content
    - browser
    - session_search
    - web
    - code_execution
    - terminal
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - todo
    - tts
    - vision
    - clarify
    - computer_use
    - cronjob

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
