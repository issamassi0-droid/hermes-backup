# qa-agent — Tier B (verification / fact-check worker)
# Inherits all defaults from config.base.yaml; overrides below.

model:
  default: claude-3-haiku-20240307
  provider: anthropic
  base_url: https://api.anthropic.com/v1

agent:
  max_turns: 50
  reasoning_effort: high

browser:
  enabled: true

display:
  skin: default

skills:
  enabled:
    - grounded-citations
    - deep-web-research
    - browser
    - session_search
    - web
    - code_execution
    - terminal
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - todo
    - tts
    - vision
    - clarify
    - computer_use
    - cronjob

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
