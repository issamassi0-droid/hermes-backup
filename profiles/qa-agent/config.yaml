# qa-agent — Tier B (verification / fact-check worker)
# Inherits all defaults from config.base.yaml; overrides below.
# Uses FreeLLMAPI with a different model family for Tier 3 compliance.

model:
  default: glm-5.3
  provider: FreeLLMAPI
  api_key: HERMES_FREELMAPI_KEY
  base_url: http://localhost:3001/v1

custom_providers:
  - name: FreeLLMAPI
    base_url: http://localhost:3001/v1
    key_env: HERMES_FREELMAPI_KEY
    model: auto
    models:
      auto: {}
      fusion: {}
    models_discovered: false

agent:
  max_turns: 50
  reasoning_effort: high

browser:
  enabled: true

display:
  skin: default

skills:
  enabled:
    - grounded-citations
    - deep-web-research
    - browser
    - session_search
    - web
    - code_execution
    - terminal
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - todo
    - tts
    - vision
    - clarify
    - computer_use
    - cronjob

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers