# analytics-agent — Tier B (analytics / metrics worker)
# Inherits all defaults from config.base.yaml; overrides below.

model:
  default: nemotron-3-ultra-free
  provider: opencode-free
  base_url: https://opencode.ai/zen/v1

agent:
  max_turns: 100
  reasoning_effort: medium

browser:
  enabled: true

display:
  skin: default

skills:
  enabled:
    - xlsx
    - competitor-news-monitor
    - rss-feeds
    - session_search
    - deep-web-research
    - browser
    - web
    - code_execution
    - terminal
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - todo
    - tts
    - vision
    - clarify
    - computer_use
    - cronjob
    - x_search
    - yuanbao

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
