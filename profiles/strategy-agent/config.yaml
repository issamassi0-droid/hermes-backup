# strategy-agent — Tier A (governor peer / strategic planning)
# Inherits all defaults from config.base.yaml; overrides below.

model:
  default: auto
  provider: FreeLLMAPI
  api_key: HERMES_FREELMAPI_KEY
  base_url: http://localhost:3001/v1

custom_providers:
  - name: FreeLLMAPI
    base_url: http://localhost:3001/v1
    key_env: HERMES_FREELMAPI_KEY
    model: auto
    models:
      auto: {}
      fusion: {}
    models_discovered: false

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
  disabled: []

memory:
  provider: builtin

gateway:
  enabled: false