# strategy-agent — Tier A (governor peer / strategic planning)
# Inherits all defaults from config.base.yaml; overrides below.

model:
  default: auto
  provider: builtin
  base_url: http://localhost:3001/v1

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
  disabled: []

memory:
  provider: builtin

gateway:
  enabled: false
