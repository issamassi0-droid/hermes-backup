# drafting-agent — Tier B (writing / publication prep)
# Inherits all defaults from config.base.yaml; overrides below.
# Memory backend: builtin.

model:
  default: nemotron-3-ultra-free
  provider: opencode-free
  base_url: https://opencode.ai/zen/v1

browser:
  enabled: true

display:
  skin: default

skills:
  enabled:
    - humanizer
    - grounded-citations
    - obsidian-markdown
    - writing-for-agents
    - deep-web-research
    - browser
    - session_search
    - web
    - code_execution
    - terminal
    - delegation
    - file
    - image_gen
    - memory
    - skills
    - todo
    - tts
    - vision
    - clarify
    - computer_use
    - cronjob

plugins:
  enabled:
    - deer-flow
    - open-second-brain
    - superpowers
